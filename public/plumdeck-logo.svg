    <path d="M574 191c50-8 95-17 137-28" fill="none" stroke="#d0e58d" stroke-opacity=".5" stroke-width="10" stroke-linecap="round"/>
    <circle cx="500" cy="566" r="326" fill="url(#plum)" stroke="#d67aeb" stroke-width="12"/>
    <g fill="none" stroke="#f2c9f7" stroke-opacity=".22">
      <circle cx="500" cy="566" r="270" stroke-width="10"/>
      <circle cx="500" cy="566" r="226" stroke-width="8"/>
      <circle cx="500" cy="566" r="184" stroke-width="7"/>
      <circle cx="500" cy="566" r="145" stroke-width="6"/>
    </g>
    <circle cx="500" cy="566" r="103" fill="#e1a53a" stroke="#ffe176" stroke-width="10"/>
    <circle cx="500" cy="566" r="22" fill="#160d1d" stroke="#fff2b9" stroke-width="7"/>
    <path d="M735 388c42 67 51 147 26 221" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="18" stroke-linecap="round"/>
