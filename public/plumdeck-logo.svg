<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">plumdeck</title>
  <desc id="desc">A plum shaped like a vinyl record, with concentric grooves, a center label, stem, and leaf.</desc>
  <defs>
    <radialGradient id="plum" cx="38%" cy="31%" r="72%">
      <stop offset="0" stop-color="#c54ee6"/>
      <stop offset="0.58" stop-color="#8d2eb4"/>
      <stop offset="1" stop-color="#58166f"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#60a04d"/>
      <stop offset="1" stop-color="#a6cf63"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="34" stdDeviation="34" flood-color="#050208" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="#100b16"/>
  <g filter="url(#shadow)">
    <path d="M511 274c-6-70 17-125 71-166" fill="none" stroke="#8ab653" stroke-width="34" stroke-linecap="round"/>
