name: PR checks

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'backend/**'
      - 'src/**'
      - 'src-tauri/**'
      - 'native/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig*.json'
      - 'vite.config.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Typecheck, web build and MIDI/audio tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: MIDI and audio recovery regression tests
        run: node --experimental-strip-types --test src/services/midi/generic-midi.test.mjs src/services/dj-engine/audio-ready.test.mjs

  backend:
    name: Database and import regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-pr.txt
      - run: python -m pip install -r backend/requirements-pr.txt
      - name: Test database integrity without audio inference
        env:
          PYTHONPATH: backend
        run: python -m pytest --confcutdir=backend/tests/workflow_integrity backend/tests/workflow_integrity -q
