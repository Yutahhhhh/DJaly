name: Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/release.yml'
      - 'backend/**'
      - 'src-tauri/**'
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            sidecar_target: 'aarch64-apple-darwin'
          - platform: 'windows-latest'
            args: ''
            sidecar_target: 'x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
          run_install: false

      - name: setup python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: install rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.sidecar_target == 'aarch64-apple-darwin' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: install FFmpeg (macOS)
        if: matrix.platform == 'macos-latest'
        run: brew install ffmpeg

      - name: install FFmpeg (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: choco install ffmpeg -y --no-progress

      - name: install backend dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r backend/requirements.txt

      - name: verify FFmpeg packaging requirements
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -version
          python backend/packaging_ffmpeg.py

      - name: build backend sidecar
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          # Keep CI packaging identical to local releases. The spec includes
          # Essentia/MusiCNN assets and all MCP server dependencies available
          # on the target platform.
          python -m PyInstaller --clean --noconfirm djaly-server.spec

          mkdir -p ../src-tauri/bin

          EXTENSION=""
          if [[ "${{ matrix.platform }}" == "windows-latest" ]]; then
            EXTENSION=".exe"
          fi

          mv dist/djaly-server$EXTENSION ../src-tauri/bin/djaly-server-${{ matrix.sidecar_target }}$EXTENSION
          chmod +x ../src-tauri/bin/djaly-server-${{ matrix.sidecar_target }}$EXTENSION 2>/dev/null || true
          test -f ../src-tauri/bin/djaly-server-${{ matrix.sidecar_target }}$EXTENSION
          ls -la ../src-tauri/bin/

      - name: build tauri app
        run: pnpm exec tauri build ${{ matrix.args }}
        env:
          CI: true
          TAURI_SKIP_SIDECAR: true

      - name: verify macOS bundles
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          compgen -G 'src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg' > /dev/null
          compgen -G 'src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz' > /dev/null

      - name: verify Windows bundles
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          compgen -G 'src-tauri/target/release/bundle/msi/*.msi' > /dev/null
          compgen -G 'src-tauri/target/release/bundle/nsis/*.exe' > /dev/null

      - name: upload artifacts (macos)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'macos-latest'
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          files: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: upload artifacts (windows)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
