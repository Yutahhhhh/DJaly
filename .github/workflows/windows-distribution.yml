name: Windows distribution validation

on:
  pull_request:
    paths:
      - '.github/workflows/windows-distribution.yml'
      - 'native/mixxx-engine-host/scripts/build-windows.py'
      - 'backend/domain/services/analysis/portable.py'
      - 'src-tauri/tauri.windows.conf.json'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: windows-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: |
            native/mixxx-engine-host/build-deps
            native/mixxx-engine-host/upstream
            native/mixxx-engine-host/build-upstream
          key: windows-native-${{ hashFiles('native/mixxx-engine-host/scripts/build-windows.py', 'native/mixxx-engine-host/cmake/**') }}
          restore-keys: windows-native-
      - run: python -m pip install cmake ninja
      - name: Build and test real native engine
        run: python native/mixxx-engine-host/scripts/build-windows.py
      - uses: actions/cache/save@v4
        if: always() && steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: |
            native/mixxx-engine-host/build-deps
            native/mixxx-engine-host/upstream
            native/mixxx-engine-host/build-upstream
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-native-engine
          path: native/mixxx-engine-host/stage/PlumdeckMixxxHost
          if-no-files-found: error

  backend:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: choco install ffmpeg -y --no-progress
      - run: python -m pip install -r backend/requirements.txt
      - name: Portable analysis regression tests
        env:
          PYTHONPATH: backend
        run: |
          python -m pytest --confcutdir=backend/tests/portable_audio backend/tests/portable_audio -q
          python -m pytest --confcutdir=backend/tests/portability backend/tests/portability -q
      - name: Analyze real generated audio using Windows runtime
        run: python backend/analysis_diagnostic.py
      - name: Package backend
        working-directory: backend
        run: python -m PyInstaller --clean --noconfirm plumdeck-server.spec
      - name: Validate bundled decoder and model without developer PATH
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          & .\backend\dist\plumdeck-server.exe --diagnose-analysis
          if ($LASTEXITCODE -ne 0) { throw 'Packaged analysis failed' }
      - name: Start packaged API and initialize MCP
        run: python scripts/smoke-backend.py backend/dist/plumdeck-server.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-backend
          path: backend/dist/plumdeck-server.exe
          if-no-files-found: error

  installer:
    needs: [native, backend]
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - uses: actions/download-artifact@v4
        with:
          name: windows-native-engine
          path: native/mixxx-engine-host/stage/PlumdeckMixxxHost
      - uses: actions/download-artifact@v4
        with:
          name: windows-backend
          path: src-tauri/bin
      - shell: pwsh
        run: Rename-Item src-tauri/bin/plumdeck-server.exe plumdeck-server-x86_64-pc-windows-msvc.exe
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tauri build --config src-tauri/tauri.windows.conf.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install and start desktop app from a relocated Unicode directory
        run: python scripts/smoke-windows-installer.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
